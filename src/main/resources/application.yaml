spring:
  application:
    name: algoga_server

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID} # 카카오 디벨로퍼스 REST API 키
            client-secret: ${KAKAO_CLIENT_SECRET} # (선택) 카카오 보안 설정에서 발급받은 코드
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        # 👇 카카오 통신 주소 (구글은 생략 가능하지만 카카오는 필수)
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  config:
    import:
      - optional:classpath:/domains/banner.yml
      - optional:classpath:/domains/userProfile.yml

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    openai:
      base-url: https://api.groq.com/openai/v1
      api-key: ${LLM_KEY}
      chat:
        options:
          model: openai/gpt-oss-20b # 챗봇 답변용 모델
          temperature: 0.7

    ollama:
      base-url: http://localhost:11434
      chat:
        enabled: false
      embedding:
        options:
          model: bge-m3 # 벡터 필터링용 모델

server:
  port: 15000
  forward-headers-strategy: native

logging:
  level:
    org.hibernate.SQL: debug

springdoc:
  default-produces-media-type: application/json

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: 1800000 # 30분
  refresh-token-expiration: 604800000 # 7일
  # 로컬에서는 값을 안 넣으면 빈 문자열로 기본 설정됨 -> 쿠키에 Domain 속성 자체를 안 붙여서(host-only) localhost에서도 정상 저장/전송됨
  cookie-domain: ${COOKIE_DOMAIN:}

app:
  file:
    upload-root: uploads

portone:
  base-url: ${PORTONE_BASE_URL}
  store-id: ${PORTONE_STORE_ID}
  api-secret: ${PORTONE_API_SECRET}
  channel-key: ${PORTONE_CHANNEL_KEY}

cloud:
  aws:
    s3:
      endpoint: ${S3_ENDPOINT}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2

flight:
  api:
    base-url: ${FLIGHT_BASE_URL}
    service-key: ${FLIGHT_API_SERVICE_KEY}

user:
  storage:
    bucket: algoga-banner
    directory: profiles

  app:
    frontend:
      base-url: ${FRONTEND_URL:http://localhost:17000}
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, circuitbreakers
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: algoga-server
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10 # 10번의 호출을 기준으로 통계 산출
        minimumNumberOfCalls: 5 # 최소 5번 호출 후부터 실패율 계산
        permittedNumberOfCallsInHalfOpenState: 3 # 반열림 상태에서 허용할 테스트 호출 수
        waitDurationInOpenState: 10s # 서킷이 열린 후 10초 대기 후 반열림 상태로 전환
        failureRateThreshold: 50 # 실패율 50% 이상이면 서킷 오픈 (호출 차단)
    instances:
      groqLlmApi:
        baseConfig: default
      portone:
        # CLOSED → OPEN: 10번 호출 중 50% 이상 실패 시
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        # OPEN 상태 유지 시간 (10초 후 HALF_OPEN 전환)
        wait-duration-in-open-state: 10s
        # HALF_OPEN 상태에서 허용할 테스트 호출 수
        permitted-number-of-calls-in-half-open-state: 3
        # 예외 기록 대상: BusinessException은 제외 (PortOne이 정상 응답한 것)
        ignore-exceptions:
          - com.kidmily.algoga_server.global.exception.BusinessException
        register-health-indicator: true
      flight:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s  # 공공 API라 복구 시간 더 여유있게
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.kidmily.algoga_server.global.exception.BusinessException
        register-health-indicator: true
  timelimiter:
    instances:
      portone:
        # PortOne API 타임아웃: 5초
        timeout-duration: 5s
        cancel-running-future: true
      flight:
        # 항공편 API 타임아웃: 10초 (공공데이터 API라 느릴 수 있음)
        timeout-duration: 10s
        cancel-running-future: true

# 동적 TTL 자동 조정 (DynamicTtlScheduler) — 캐시 히트율 보고 TTL 자동 확장/축소
algoga:
  cache:
    dynamic-ttl:
      enabled: true           # false 로 끄면 TTL 고정(baseline) 동작
      interval-ms: 3600000    # 1시간마다 히트율 보고 TTL 조정
      initial-delay-ms: 60000 # 기동 60초 후 첫 조정
