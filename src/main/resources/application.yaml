spring:
  application:
    name: algoga_server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/algoga
    username: algoga
    password: algoga

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: 15000

logging:
  level:
    org.hibernate.SQL: debug

springdoc:
  default-produces-media-type: application/json

app:
  file:
    upload-root: uploads