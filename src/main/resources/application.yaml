spring:
  application:
    name: algoga_server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/algoga
    username: algoga
    password: algoga
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
server:
  port: 15000
logging:
  level:
    org.hibernate.SQL: debug
springdoc:
  default-produces-media-type: application/json # API 응답(Response) 기본 미디어 타입