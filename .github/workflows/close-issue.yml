name: Auto Close Issue on Any PR Merge

on:
  pull_request:
    types: [closed]

# 이슈를 수정(닫기)할 수 있는 쓰기 권한 부여
permissions:
  issues: write
  pull-requests: read

jobs:
  close-issue:
    # PR이 '닫힘' 상태이고, '머지'가 성공적으로 완료되었을 때만 실행
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            // 본문에서 'closes #번호' 또는 'fixes #번호' 패턴을 찾습니다.
            const regex = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi;
            let match;
            
            while ((match = regex.exec(body)) !== null) {
              const issueNumber = parseInt(match[1], 10);
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed'
                });
                console.log(`Successfully closed issue #${issueNumber}`);
              } catch (error) {
                console.log(`Failed to close issue #${issueNumber}: ${error.message}`);
              }
            }
