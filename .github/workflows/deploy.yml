name: Deploy Spring Boot to Ubuntu Server

# develop 브랜치에 코드가 push 되거나 merge 될 때 동작합니다.
on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # 1. 프로젝트 폴더로 이동
            cd /home/ubuntu/kidmily
            
            # 2. 최신 코드 가져오기 (on.push의 브랜치와 일치시킴)
            git pull origin develop
            
            # 3. Gradle 빌드 진행
            chmod +x ./gradlew
            ./gradlew clean build -x test
            
            # 4. 기존 kidmily tmux 세션이 있다면 강제 종료 (포트 충돌 방지)
            tmux kill-session -t kidmily 2>/dev/null || true
            
            # 5. 새롭게 빌드된 jar 파일 경로 찾기 (-plain.jar는 제외하는 정규식)
            JAR_PATH=$(ls build/libs/*.jar | grep -v 'plain' | tail -n 1)
            
            # 6. .env 파일의 줄바꿈 문자를 리눅스(LF) 형식으로 안전하게 변환
            dos2unix /home/ubuntu/kidmily/.env
            
            # 7. kidmily 라는 이름의 새 tmux 세션을 백그라운드(-d)로 생성
            tmux new-session -d -s kidmily
            
            # 8. 생성된 tmux 세션 안으로 환경변수 로드 및 java 실행 명령어 전송
            echo "환경변수를 로드하고 새 애플리케이션을 kidmily tmux 세션에서 실행합니다: $JAR_PATH"
            
            # 환경변수 자동 export 활성화
            tmux send-keys -t kidmily "set -a" C-m
            
            # .env 파일 로드
            tmux send-keys -t kidmily "source /home/ubuntu/kidmily/.env" C-m
            
            # 환경변수 자동 export 비활성화
            tmux send-keys -t kidmily "set +a" C-m
            
            # Spring Boot 애플리케이션 실행
            tmux send-keys -t kidmily "java -jar $JAR_PATH" C-m