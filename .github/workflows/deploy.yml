name: Deploy Spring Boot to Ubuntu Server and AWS ECS

on:
  push:
    branches:
      - develop

jobs:
  # ---------------------------------------------------------
  # 1. 기존 배포: SSH를 통한 EC2 직접 배포 (기존 코드 완벽 유지)
  # ---------------------------------------------------------
  deploy-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/kidmily
            git pull origin develop
            chmod +x ./gradlew
            ./gradlew clean build -x test

            # ── 기존 인스턴스 종료 (프로세스 먼저 → 그다음 tmux 세션 정리) ──
            # tmux 세션만 죽이면 안의 java가 살아남아 15000 포트를 계속 점유하므로, 앱 프로세스를 먼저 끝낸다.
            # 1) 15000 포트를 점유한 프로세스를 우아하게 종료(SIGTERM) → 포트 해제 대기 → 안 되면 강제(SIGKILL)
            APP_PID=$(fuser 15000/tcp 2>/dev/null | tr -d ' ')
            if [ -n "$APP_PID" ]; then
              echo "기존 앱 종료 시도 (PID: $APP_PID, SIGTERM)"
              kill $APP_PID 2>/dev/null || true
              for i in $(seq 1 20); do
                ss -ltn 2>/dev/null | grep -q ':15000 ' || break
                echo "15000 포트 해제 대기... ($i)"
                sleep 1
              done
              if ss -ltn 2>/dev/null | grep -q ':15000 '; then
                echo "정상 종료 실패 → 강제 종료 (SIGKILL)"
                fuser -k 15000/tcp 2>/dev/null || true
                sleep 2
              fi
            fi
            # 2) 남은 tmux 세션 정리
            tmux kill-session -t kidmily 2>/dev/null || true

            JAR_PATH=$(ls build/libs/*.jar | grep -v 'plain' | tail -n 1)
            dos2unix /home/ubuntu/kidmily/.env
            tmux new-session -d -s kidmily
            echo "환경변수를 로드하고 새 애플리케이션을 kidmily tmux 세션에서 실행합니다: $JAR_PATH"
            tmux send-keys -t kidmily "set -a" C-m
            tmux send-keys -t kidmily "source /home/ubuntu/kidmily/.env" C-m
            tmux send-keys -t kidmily "set +a" C-m
            tmux send-keys -t kidmily "java -jar $JAR_PATH" C-m

  # ---------------------------------------------------------
  # 2. 신규 배포: Spring Boot Docker 빌드 후 AWS ECR & ECS 배포
  # ---------------------------------------------------------
  deploy-ecs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # GitHub 서버에 Java 17 환경 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Spring Boot 프로젝트 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test
          # 빌드된 여러 jar 중 plain을 제외한 진짜 실행용 jar를 app.jar로 복사 (도커 빌드용)
          cp $(ls build/libs/*.jar | grep -v 'plain' | tail -n 1) app.jar

      # AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Docker 이미지 빌드 및 지정하신 ECR(team02/spring-boot-app)로 업로드
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: team02/spring-boot-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # AWS에서 최신 작업 정의(Task Definition) 파일 실시간 다운로드
      # describe 결과에는 register 시 사용할 수 없는 읽기전용/최신 필드(enableFaultInjection 등)가 포함되어 있어 jq로 제거한다.
      - name: Download latest task definition
        run: |
          aws ecs describe-task-definition --task-definition team02-01-backend-task --query taskDefinition \
            | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .enableFaultInjection)' \
            > task-definition.json

      # 다운받은 작업 정의 파일에 방금 올린 새 ECR 이미지 주소 덮어쓰기
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: team02-01-backend-container
          image: ${{ steps.build-image.outputs.image }}

      # 수정된 작업 정의로 ECS 서비스 업데이트(배포)
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: team02-01-backend-task-service
          cluster: team02-01-cluster
          wait-for-service-stability: true
