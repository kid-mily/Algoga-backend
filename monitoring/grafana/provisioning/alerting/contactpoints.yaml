apiVersion: 1

# Slack 알림 연락처.
# 실제 Webhook URL은 monitoring/.env 의 SLACK_WEBHOOK_URL 에 두고(=git 제외),
# docker-compose 가 컨테이너 환경변수로 주입 → Grafana 가 $SLACK_WEBHOOK_URL 로 치환.
contactPoints:
  - orgId: 1
    name: algoga-default
    receivers:
      - uid: algoga-slack-webhook
        type: slack
        settings:
          url: $SLACK_WEBHOOK_URL
        disableResolveMessage: false
