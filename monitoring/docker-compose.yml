version: '3.8'

services:
  # 🔴 이름이 변경된 Redis (algoga-redis)
  algoga-redis:
    image: redis:latest
    container_name: algoga-redis
    ports:
      - "6379:6379"

  # 🔵 모니터링 도구 1: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'

  # 🔵 모니터링 도구 2: Loki
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  # 🔵 모니터링 도구 3: Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      # 🔴 로컬 프로젝트 루트에 생성되는 logs 폴더를 도커 컨테이너 내부로 연결
      - ../logs:/var/log/app_logs
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # 🔵 모니터링 도구 4: Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      # .env 의 SLACK_WEBHOOK_URL 을 컨테이너로 주입 → contactpoints.yaml 에서 참조.
      # .env 가 없는 팀원도 Grafana 가 뜨도록 기본 placeholder 제공(알림 발송만 안 됨).
      # 실제 알림이 필요하면 monitoring/.env 에 SLACK_WEBHOOK_URL 을 넣어 덮어쓰면 됨.
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/PLACEHOLDER/PLACEHOLDER/PLACEHOLDER}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  grafana-storage: